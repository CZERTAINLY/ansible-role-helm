---
# defaults file for helm

# Which helm release to install, as a Debian package version, e.g. 4.2.3-1 or
# 3.21.3-1. The repository carries both majors side by side, so leaving this
# empty means "whatever is newest there", which is how an appliance silently
# ends up on a new major - and the helm CLI does drop flags between majors,
# for instance Helm 4 removed "helm list --all", which the kubernetes.core
# helm module of Debian trixie still sends.
#
# When set, the version is pinned in /etc/apt/preferences.d/helm.pref as well,
# otherwise the next "apt upgrade" would undo it.
helm_version: ""
