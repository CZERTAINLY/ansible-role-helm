---
- name: Remove abandoned helm packages repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/helm.asc]
            https://baltocdn.com/helm/stable/debian/ all main
    state: absent
  register: abandoned_helm_repo_removed
  tags:
    - helm_repository

- name: Install helm prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gpg
      - git
    state: present
    update_cache: false
    cache_valid_time: 86400
  tags:
    - helm_packages
    - apt_packages

- name: Install helm keyring
  ansible.builtin.get_url:
    url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
    dest: /usr/share/keyrings/helm.asc
    mode: "0644"
    force: "{{ abandoned_helm_repo_removed.changed | default(false) }}"
  tags:
    - helm_repository
    - helm_repository_signature

- name: Add helm packages repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/helm.asc]
      https://packages.buildkite.com/helm-linux/helm-debian/any/ any main
    state: present
  tags:
    - helm_repository

# Written before the install so that a version already held by a previous run
# can't win over a newly configured helm_version. Removed again when
# helm_version is emptied, otherwise the pin would outlive the decision.
- name: Pin the helm package version
  ansible.builtin.template:
    src: helm.pref.j2
    dest: /etc/apt/preferences.d/helm.pref
    owner: root
    group: root
    mode: '0644'
  when: helm_version | length > 0
  tags:
    - helm_install
    - helm_pin

- name: Remove the helm version pin
  ansible.builtin.file:
    path: /etc/apt/preferences.d/helm.pref
    state: absent
  when: helm_version | length == 0
  tags:
    - helm_install
    - helm_pin

# The repository carries several majors at once, so without helm_version this
# installs whatever is newest there. allow_downgrade lets a pin move the
# appliance back, e.g. after a major turned out to be too new for the
# kubernetes.core collection in use.
- name: Install helm
  ansible.builtin.apt:
    name: "helm{{ ('=' ~ helm_version) if helm_version | length > 0 else '' }}"
    state: present
    cache_valid_time: 86400
    allow_downgrade: "{{ helm_version | length > 0 }}"
  # will fail in check mode if db isn't present
  when: not ansible_check_mode
  tags:
    - helm_install

- name: Configure bash autompletion for helm for all users
  ansible.builtin.template:
    src: helm-bash-autocompletion.j2
    dest: /etc/profile.d/helm.sh
    owner: root
    group: root
    mode: '0755'
  tags:
    - helm_bashrc
